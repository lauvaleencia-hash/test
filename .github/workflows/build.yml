name: Build FRACTURE BLOOM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FRACTURE_BLOOM_Windows_VST3
          path: build/FRACTURE_BLOOM_artefacts/Release/VST3/*.vst3


  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FRACTURE_BLOOM_macOS_VST3
          path: build/FRACTURE_BLOOM_artefacts/Release/VST3/*.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: FRACTURE_BLOOM_macOS_AU
          path: build/FRACTURE_BLOOM_artefacts/Release/AU/*.component
